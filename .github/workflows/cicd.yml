name: CI checks + deployment #todo: remove refs to roblox_place_id legacy secret

on:
  pull_request:
    branches: [main, prod]
  push:
    branches: [main]

env:
  BASE_PLACE_FILE: game.rbxl

jobs:
  install-tools:
    name: Install tools
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3.3.0
        with:
          lfs: true

      - name: Force LFS pull
        run: git lfs pull

      - name: Install Aftman
        uses: ok-nick/setup-aftman@v0.4.2

      - name: Cache Aftman tools
        uses: actions/cache@v4
        with:
          path: ~/.aftman
          key: tools-${{ hashFiles('aftman.toml') }}

  linting:
    name: Lint with Selene
    runs-on: ubuntu-latest
    needs: [install-tools]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3.3.0

      - name: Install Aftman
        uses: ok-nick/setup-aftman@v0.4.2

      - name: Restore cached Aftman tools
        uses: actions/cache@v4
        with:
          path: ~/.aftman
          key: tools-${{ hashFiles('aftman.toml') }}

      - name: Lint
        run: bash src/scripts/shell/lint.sh src

  formatting:
    name: Format with StyLua
    runs-on: ubuntu-latest
    needs: [install-tools]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3.3.0

      - name: Install Aftman
        uses: ok-nick/setup-aftman@v0.4.2

      - name: Restore cached Aftman tools
        uses: actions/cache@v4
        with:
          path: ~/.aftman
          key: tools-${{ hashFiles('aftman.toml') }}

      - name: Check format
        run: bash src/scripts/shell/check-format.sh src

  lune-tests:
    name: Run Lune tests
    runs-on: ubuntu-latest
    needs: [install-tools]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3.3.0

      - name: Install Aftman
        uses: ok-nick/setup-aftman@v0.4.2

      - name: Restore cached Aftman tools
        uses: actions/cache@v4
        with:
          path: ~/.aftman
          key: tools-${{ hashFiles('aftman.toml') }}

      - name: Install Wally packages
        run: wally install

      # The runner regenerates sourcemap.json via rojo and exits nonzero on
      # any failing spec.
      - name: Run tests
        run: lune run src/scripts/lune/run-tests.luau

  fetch-live-place:
    name: Fetch live published place
    runs-on: ubuntu-latest
    needs: [install-tools]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3.3.0

      - name: Install Aftman
        uses: ok-nick/setup-aftman@v0.4.2

      - name: Restore cached Aftman tools
        uses: actions/cache@v4
        with:
          path: ~/.aftman
          key: tools-${{ hashFiles('aftman.toml') }}

      # Downloads whatever place is currently live via Open Cloud's Asset
      # Delivery API, independent of this run's own test/publish outcome, so
      # agents can pull the artifact and inspect the real published place.
      - name: Fetch live place
        run: bash src/scripts/shell/fetch-live-place.sh live-place.rbxl
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}

      - name: Upload live place artifact
        uses: actions/upload-artifact@v4
        with:
          name: live-place
          path: live-place.rbxl
          retention-days: 14

  # PRs into prod run the full sequence: rojo build -> merge into game.rbxl ->
  # upload as a Saved version -> run the cloud TestEZ suite against that exact
  # version via the Open Cloud Luau Execution API -> publish only on green.
  test-and-deploy:
    name: Test and deploy via Open Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [install-tools, linting, formatting, lune-tests]
  # if: ${{ github.event_name == 'pull_request' && github.base_ref == 'prod' }}
    concurrency:
      group: luau-execution
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v3.3.0
        with:
          lfs: true

      - name: Force LFS pull
        run: git lfs pull

      - name: Install Aftman
        uses: ok-nick/setup-aftman@v0.4.2

      - name: Restore cached Aftman tools
        uses: actions/cache@v4
        with:
          path: ~/.aftman
          key: tools-${{ hashFiles('aftman.toml') }}

      - name: Install Wally packages
        run: wally install

      - name: Build, merge, test, and publish
        run: |
          set +e
          bash src/scripts/shell/deploy.sh default.project.json "$BASE_PLACE_FILE"
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::warning::Roblox Open Cloud was busy after retries; nothing was published. Re-run this job."
          fi
          exit "$code"
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}
