name: CI checks + arena deployment

on:
  pull_request:
    branches: [main, prod]
  push:
    branches: [main]

jobs:
  install-tools:
    name: Install tools
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3.3.0

      - name: Install Aftman
        uses: ok-nick/setup-aftman@v0.4.2

      - name: Cache Aftman tools
        uses: actions/cache@v4
        with:
          path: ~/.aftman
          key: tools-${{ hashFiles('aftman.toml') }}

  linting:
    name: Lint with Selene
    runs-on: ubuntu-latest
    needs: [install-tools]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3.3.0

      - name: Install Aftman
        uses: ok-nick/setup-aftman@v0.4.2

      - name: Restore cached Aftman tools
        uses: actions/cache@v4
        with:
          path: ~/.aftman
          key: tools-${{ hashFiles('aftman.toml') }}

      - name: Lint
        run: |
          bash src/scripts/shell/lint.sh src
          bash src/scripts/shell/lint.sh places/lobby/src

  formatting:
    name: Format with StyLua
    runs-on: ubuntu-latest
    needs: [install-tools]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3.3.0

      - name: Install Aftman
        uses: ok-nick/setup-aftman@v0.4.2

      - name: Restore cached Aftman tools
        uses: actions/cache@v4
        with:
          path: ~/.aftman
          key: tools-${{ hashFiles('aftman.toml') }}

      - name: Check format
        run: |
          bash src/scripts/shell/check-format.sh src
          bash src/scripts/shell/check-format.sh places/lobby/src

  lune-tests:
    name: Run Lune tests
    runs-on: ubuntu-latest
    needs: [install-tools]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3.3.0

      - name: Install Aftman
        uses: ok-nick/setup-aftman@v0.4.2

      - name: Restore cached Aftman tools
        uses: actions/cache@v4
        with:
          path: ~/.aftman
          key: tools-${{ hashFiles('aftman.toml') }}

      - name: Install Wally packages
        run: wally install

      - name: Build place projects
        run: |
          rojo build arena.project.json --output /tmp/arena.rbxl
          rojo build lobby.project.json --output /tmp/lobby.rbxl

      # The runner regenerates sourcemap.json via rojo and exits nonzero on
      # any failing spec.
      - name: Run tests
        run: lune run src/scripts/lune/run-tests.luau

  # PRs into prod run the full sequence: fetch the currently-live place via
  # Open Cloud -> rojo build -> merge rojo's build into that exact fetched
  # place (so the merge base is never a possibly-stale committed copy) ->
  # upload as a Saved version -> run the cloud TestEZ suite against that exact
  # version via the Open Cloud Luau Execution API -> publish only on green.
  test-and-deploy:
    name: Test and deploy via Open Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [install-tools, linting, formatting, lune-tests]
  # if: ${{ github.event_name == 'pull_request' && github.base_ref == 'prod' }}
    concurrency:
      group: luau-execution
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v3.3.0

      - name: Install Aftman
        uses: ok-nick/setup-aftman@v0.4.2

      - name: Restore cached Aftman tools
        uses: actions/cache@v4
        with:
          path: ~/.aftman
          key: tools-${{ hashFiles('aftman.toml') }}

      - name: Install Wally packages
        run: wally install

      # Downloads whatever place is currently live via Open Cloud's Asset
      # Delivery API. This exact file is both the merge base below and the
      # uploaded artifact, so agents inspecting the artifact see precisely
      # what this run built against.
      - name: Fetch live place
        timeout-minutes: 4
        run: bash src/scripts/shell/fetch-live-place.sh live-place.rbxl
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_PLACE_ID: "121997450145716"

      - name: Upload live place artifact
        uses: actions/upload-artifact@v4
        with:
          name: live-place
          path: live-place.rbxl
          retention-days: 14

      - name: Build, merge, test, and publish
        timeout-minutes: 15
        run: |
          set +e
          bash src/scripts/shell/deploy.sh arena.project.json live-place.rbxl
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::warning::Roblox Open Cloud was busy after retries; nothing was published. Re-run this job."
          fi
          exit "$code"
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: "121997450145716"
