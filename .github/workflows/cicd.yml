name: CI checks + deployment #todo: remove refs to roblox_place_id legacy secret

on:
  pull_request:
    branches: [main, prod]
  push:
    branches: [main]

env:
  BASE_PLACE_FILE: game.rbxl

jobs:
  install-tools:
    name: Install tools
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3.3.0
        with:
          lfs: true

      - name: Force LFS pull
        run: git lfs pull

      - name: Install Aftman
        uses: ok-nick/setup-aftman@v0.4.2

      - name: Cache Aftman tools
        uses: actions/cache@v4
        with:
          path: ~/.aftman
          key: tools-${{ hashFiles('aftman.toml') }}

  linting:
    name: Lint with Selene
    runs-on: ubuntu-latest
    needs: [install-tools]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3.3.0

      - name: Install Aftman
        uses: ok-nick/setup-aftman@v0.4.2

      - name: Restore cached Aftman tools
        uses: actions/cache@v4
        with:
          path: ~/.aftman
          key: tools-${{ hashFiles('aftman.toml') }}

      - name: Lint
        run: bash src/scripts/shell/lint.sh src

  formatting:
    name: Format with StyLua
    runs-on: ubuntu-latest
    needs: [install-tools]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3.3.0

      - name: Install Aftman
        uses: ok-nick/setup-aftman@v0.4.2

      - name: Restore cached Aftman tools
        uses: actions/cache@v4
        with:
          path: ~/.aftman
          key: tools-${{ hashFiles('aftman.toml') }}

      - name: Check format
        run: bash src/scripts/shell/check-format.sh src

  lune-tests:
    name: Run Lune tests
    runs-on: ubuntu-latest
    needs: [install-tools]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3.3.0

      - name: Install Aftman
        uses: ok-nick/setup-aftman@v0.4.2

      - name: Restore cached Aftman tools
        uses: actions/cache@v4
        with:
          path: ~/.aftman
          key: tools-${{ hashFiles('aftman.toml') }}

      - name: Install Wally packages
        run: wally install

      # The runner regenerates sourcemap.json via rojo and exits nonzero on
      # any failing spec.
      - name: Run tests
        run: lune run src/scripts/lune/run-tests.luau

  # luau-tests:
