  #     - name: Install Aftman
  #       uses: ok-nick/setup-aftman@v0.4.2

  #     - name: Restore cached Aftman tools
  #       uses: actions/cache@v4
  #       with:
  #         path: ~/.aftman
  #         key: tools-${{ hashFiles('aftman.toml') }}

  #     - name: Build, merge and run tests
  #       run: |
  #         set +e
  #         bash src/Scripts/Shell/test.sh default.project.json "$BASE_PLACE_FILE" "$TEST_TASK_FILE"
  #         code=$?
  #         set -e
  #         if [ "$code" -eq 2 ]; then
  #           echo "::warning::Roblox Open Cloud was busy after retries; scenario tests were skipped for this run."
  #           exit 0
  #         fi
  #         exit "$code"
  #       env:
  #         ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
  #         ROBLOX_UNIVERSE_ID: ${{ secrets.ROBLOX_STAGING_UNIVERSE_ID }}
  #         ROBLOX_PLACE_ID: ${{ secrets.ROBLOX_STAGING_PLACE_ID }}
  #         TEST_TASK_FILE: src/Tests/RunTests.luau

  deployment:
    name: Deployment
    runs-on: ubuntu-latest
    needs: [install-tools, linting, formatting, lune-tests] # Open Cloud luau-tests intentionally remains commented out above.
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'prod' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3.3.0
        with:
          lfs: true

      - name: Force LFS pull
        run: git lfs pull

      - name: Install Aftman
        uses: ok-nick/setup-aftman@v0.4.2

      - name: Restore cached Aftman tools
        uses: actions/cache@v4
        with:
          path: ~/.aftman
          key: tools-${{ hashFiles('aftman.toml') }}

      - name: Build, merge and publish
        run: bash src/Scripts/Shell/publish.sh default.project.json "$BASE_PLACE_FILE"
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ secrets.ROBLOX_STAGING_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ secrets.ROBLOX_STAGING_PLACE_ID }}
