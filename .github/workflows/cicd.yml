name: CI checks + place deployment

on:
  pull_request:
    branches: [main, prod]
  push:
    branches: [main, prod]

concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/prod' && 'production-release' || format('ci-{0}', github.run_id) }}
  queue: max
  cancel-in-progress: false

jobs:
  linting:
    name: Lint with Selene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3.3.0
      - uses: ./.github/actions/setup-tools
      - name: Lint
        run: |
          bash src/scripts/shell/lint.sh src
          bash src/scripts/shell/lint.sh places/arena
          bash src/scripts/shell/lint.sh places/lobby

  formatting:
    name: Format with StyLua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3.3.0
      - uses: ./.github/actions/setup-tools
      - name: Check format
        run: |
          bash src/scripts/shell/check-format.sh src
          bash src/scripts/shell/check-format.sh places/arena
          bash src/scripts/shell/check-format.sh places/lobby

  lune-tests:
    name: Run Lune tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3.3.0
      - uses: ./.github/actions/setup-tools
      - name: Install Wally packages
        run: |
          git ls-files --error-unmatch wally.lock
          wally install
          git diff --exit-code -- wally.lock
      - name: Run tests
        run: lune run src/scripts/lune/run-tests.luau
      - name: Test deployment tooling
        run: |
          bash src/scripts/shell/test-changed-places.sh
          lune run src/scripts/lune/test-release-artifact.luau
          lune run src/scripts/lune/test-release.luau

  build-places:
    name: Build ${{ matrix.place }} artifact
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        place: [arena, lobby]
    steps:
      - uses: actions/checkout@v3.3.0
        with:
          lfs: true
      - uses: ./.github/actions/setup-tools
      - name: Install Wally packages
        run: |
          git ls-files --error-unmatch wally.lock
          wally install
          git diff --exit-code -- wally.lock
      - name: Build and validate merged place
        run: bash src/scripts/shell/build-place.sh ${{ matrix.place }} .ci-build/${{ matrix.place }}
      - name: Retain merged place and provenance
        uses: actions/upload-artifact@v4
        with:
          name: place-${{ matrix.place }}
          path: |
            .ci-build/${{ matrix.place }}/dist.rbxl
            .ci-build/${{ matrix.place }}/manifest.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  changed-places:
    name: Detect changed places
    runs-on: ubuntu-latest
    outputs:
      places: ${{ steps.detect.outputs.places }}
    steps:
      - uses: actions/checkout@v3.3.0
        with:
          fetch-depth: 0
      - name: Detect
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          places=$(bash src/scripts/shell/changed-places.sh "$BASE_SHA")
          echo "Places to deploy: $places"
          echo "places=$places" >> "$GITHUB_OUTPUT"

  deploy:
    name: Release affected places
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [linting, formatting, lune-tests, build-places, changed-places]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/prod' && needs.changed-places.outputs.places != '[]' }}
    steps:
      - uses: actions/checkout@v3.3.0
      - uses: ./.github/actions/setup-tools
      - name: Download validated place artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: place-*
          path: .ci-release
      - name: Test every affected place, then publish
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ vars.OUCH_UNIVERSE_ID }}
          ARENA_PLACE_ID: ${{ vars.ARENA_PLACE_ID }}
          LOBBY_PLACE_ID: ${{ vars.LOBBY_PLACE_ID }}
          PLACES: ${{ needs.changed-places.outputs.places }}
        run: lune run src/scripts/lune/release-places.luau .ci-release "$PLACES"
      - name: Retain release versions and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-release
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
