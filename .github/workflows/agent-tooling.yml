name: Native Windows agent tooling
on:
  pull_request:
    paths: ['tools/**', 'manifests/**', 'generated/**', '.github/workflows/agent-tooling.yml']
  push:
    branches: [main, prod, tooling/agent-workflow]
    paths: ['tools/**', 'manifests/**', 'generated/**', '.github/workflows/agent-tooling.yml']
permissions:
  contents: read
jobs:
  offline-regressions:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements.txt
      - run: python tools/run_safe_tests.py
